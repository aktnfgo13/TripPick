<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'"
  /><title>여행 지도</title
  ><link rel="stylesheet" href="style.css" />
  <main>
    <header>
      <h1>여행 지도</h1>
      <button id="home">전국 지도</button><button id="refresh">새로고침</button>
    </header>
    <p id="message" role="status"></p>
    <div id="layout">
      <section>
        <h2 id="heading">대한민국</h2>
        <svg
          id="map"
          role="img"
          aria-label="대한민국 시도 경계와 선택 지역의 방문 장소"
        ></svg>
        <div id="zoom">
          <button id="plus">확대</button><button id="minus">축소</button>
        </div>
        <small>경계 © geoBoundaries · Natural Earth (2021)</small>
      </section>
      <section>
        <label id="region-search">지역 검색 <input id="query" type="search" /></label>
        <div id="choices"></div>
        <div id="detail"></div>
      </section>
    </div>
    <details id="manage">
      <summary>방문 기록과 사진 편집</summary>
      <form id="newvisit">
        <label>장소명 <input id="name" required maxlength="160" /></label
        ><label
          >장소 분류 <input id="category" value="장소" maxlength="40" /></label
        ><label
          >시군구 코드 (선택) <input id="district" pattern="[0-9]{5}" /></label
        ><label
          >위도
          <input
            id="lat"
            type="number"
            step="any"
            min="-90"
            max="90"
            required /></label
        ><label
          >경도
          <input
            id="lon"
            type="number"
            step="any"
            min="-180"
            max="180"
            required /></label
        ><button>방문 등록</button>
      </form>
      <label
        >사진
        <select id="photo"></select></label
      ><label
        >연결할 방문
        <select id="visit"></select></label
      ><button id="link">장소 연결 저장</button>
    </details>
  </main>
  <script type="module" src="journal.js"></script>
</html>
